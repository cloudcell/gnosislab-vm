name: Repository hygiene
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # Required to scan PR commit history
      - name: Validate Bash scripts (syntax only)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            if head -c 128 "$f" | grep -q '^#!.*\(ba\)\?sh'; then
              bash -n "$f"
            fi
          done < <(find . -type f -name '*.sh' -print0)
          bash -n create-lab-template create-lab-user .githooks/pre-commit
      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          for path in README.md LICENSE SECURITY.md CONTRIBUTING.md CITATION.cff CHANGELOG.md WORKFLOW.md; do
            test -s "$path" || { echo "Missing or empty $path" >&2; exit 1; }
          done
      - name: Detect obsolete public branding in main entry points
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '^# (LabLoop|ML-LabLoop)|cloudcell/labloop' README.md CONTRIBUTING.md WORKFLOW.md; then
            echo 'Obsolete primary branding/link detected' >&2
            exit 1
          fi
      # Feature 2: keep secret detection inside the existing required status check.
      - name: Scan Git commits for exposed secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          # Do not disclose finding details via public PR comments/artifacts.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
