name: Repository hygiene
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Static checks on shell scripts and container build definitions.
  shell-security:
    name: shell-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Check tracked shell scripts for high-severity errors
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            test -f "$file" || continue
            if [[ "$file" != *.sh ]] && ! head -c 128 "$file" | grep -Eq '^#!.*(ba)?sh([[:space:]]|$)'; then
              continue
            fi
            echo "ShellCheck: $file"
            shellcheck --severity=error -- "$file"
            count=$((count + 1))
          done < <(git ls-files -z)
          test "$count" -gt 0 || { echo 'No shell scripts were checked' >&2; exit 1; }
          echo "ShellCheck inspected $count scripts."

  container-security:
    name: container-security
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint untrusted experiment Containerfile (enforced errors)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: containers/experiment/Containerfile
          failure-threshold: error
          no-color: true
      - name: Lint trusted MCP Containerfile (enforced errors)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: containers/mcp/Containerfile
          failure-threshold: error
          no-color: true
      # Existing VM/container isolation decisions need manual security review.
      # Trivy reports high/critical IaC findings; do not silently waive them.
      # Enable a blocking exit code only after triaging documented legacy gaps.
      - name: Scan container and infrastructure configuration (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          hide-progress: true
          cache: 'false'

  codeql-python:
    name: codeql-python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL for Python
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - name: Analyze Python
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:python

  dependency-review:
    name: dependency-review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Block newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  workflow-supply-chain:
    name: workflow-supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions supply-chain policy
        run: python3 scripts/check-workflow-supply-chain.py
      - name: Validate GitHub Actions YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |file| YAML.parse_file(file); puts "Valid YAML: #{file}" }'
      - name: Test guest-agent transport and recovery (offline)
        run: python3 -m unittest discover -s tests -p 'test_qga.py' -v
      - name: Test VM publication attestation integration (offline)
        run: python3 -m unittest discover -s tests -p 'test_vm_publication_attestation.py' -v
      - name: Test standard numbered publication workflows (offline)
        run: python3 -m unittest discover -s tests -p 'test_standard_publication_scripts.py' -v
      - name: Enforce trusted-runtime asset isolation (offline)
        run: python3 -m unittest discover -s tests -p 'test_trusted_runtime_assets.py' -v
      - name: Verify fail-closed VM trial isolation preflight (offline)
        run: python3 -m unittest discover -s tests -p 'test_vm_trial_isolation.py' -v
      - name: Test VSCodium launcher and VSIX selection (offline)
        run: python3 -m unittest discover -s tests -p 'test_codium_launcher.py' -v

  repository-hygiene:
    # The branch ruleset requires this specific job. Fail closed if any
    # upstream scan fails, rather than allowing skipped jobs as passing checks.
    if: ${{ always() }}
    needs: [shell-security, container-security, codeql-python, dependency-review, workflow-supply-chain]
    name: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful security analysis
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.shell-security.result }}" = success
          test "${{ needs.container-security.result }}" = success
          test "${{ needs.codeql-python.result }}" = success
          test "${{ needs.workflow-supply-chain.result }}" = success
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            test "${{ needs.dependency-review.result }}" = success
          else
            test "${{ needs.dependency-review.result }}" = skipped
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Required to scan PR commit history
      - name: Validate Bash scripts (syntax only)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            if head -c 128 "$f" | grep -q '^#!.*\(ba\)\?sh'; then
              bash -n "$f"
            fi
          done < <(find . -type f -name '*.sh' -print0)
          bash -n create-lab-template create-lab-user .githooks/pre-commit
      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          for path in README.md LICENSE SECURITY.md CONTRIBUTING.md CITATION.cff CHANGELOG.md WORKFLOW.md; do
            test -s "$path" || { echo "Missing or empty $path" >&2; exit 1; }
          done
      - name: Detect obsolete public branding in main entry points
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '^# (LabLoop|ML-LabLoop)|cloudcell/labloop' README.md CONTRIBUTING.md WORKFLOW.md; then
            echo 'Obsolete primary branding/link detected' >&2
            exit 1
          fi
      # Feature 2: keep secret detection inside the existing required status check.
      - name: Scan Git commits for exposed secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          # Do not disclose finding details via public PR comments/artifacts.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
